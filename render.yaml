# Render Blueprint: web service + managed Postgres. Deploy via Dashboard → New → Blueprint.
services:
  - type: web
    name: sleep360
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app wsgi db upgrade && gunicorn wsgi:app --workers 2 --threads 4 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sleep360-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false   # set in the dashboard (optional)
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5

databases:
  - name: sleep360-db
    plan: free
    databaseName: sleep360
