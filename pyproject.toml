[project]
name = "sleep360"
version = "2.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:flask_limiter.*"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "S311", "B904", "E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
